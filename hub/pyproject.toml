[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bambu-hub"
version = "0.1.0"
description = "Home hub that runs scheduled prints on a Bambu Lab A1, driven by Supabase"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "paho-mqtt>=2.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10"]

[project.scripts]
bambu-hub = "bambu_hub.main:main"

[tool.hatch.build.targets.wheel]
packages = ["bambu_hub"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["bambu_hub"]

[[tool.mypy.overrides]]
module = ["paho.*"]
ignore_missing_imports = true
